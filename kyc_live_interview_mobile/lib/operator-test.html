<!doctype html>
<html>
<head><meta charset="utf-8"><title>Operator Test</title></head>
<body>
<video id="local" autoplay playsinline muted></video>
<video id="remote" autoplay playsinline></video>

<!-- IMPORTANT: v2.4.0 (EIO=3) for netty-socketio -->
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@2.4.0/dist/socket.io.js"></script>
<script>
    (async function () {
      const meetingId = dbf9d2bd-6da5-4096-a445-3d70708e4f5e;
      const socket = io('http://localhost:8000', { transports: ['websocket'], path: '/socket.io/' });

      const pc = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' }
          // add TURN here if needed (see section B)
        ]
      });

      pc.onicecandidate = e => { if (e.candidate) socket.emit('candidate', { room: meetingId, candidate: e.candidate }); };
      pc.ontrack = ev => { const v=document.getElementById('remote'); v.srcObject = ev.streams[0]; v.play().catch(()=>{}); };

      const local = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
      document.getElementById('local').srcObject = local;
      local.getTracks().forEach(t => pc.addTrack(t, local));

      socket.on('connect', () => socket.emit('joinRoom', meetingId));
      socket.on('offer', async ({ sdp }) => {
        await pc.setRemoteDescription({ type: 'offer', sdp: sdp.sdp });
        const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
        socket.emit('answer', { room: meetingId, sdp: { type: ans.type, sdp: ans.sdp } });
      });
      socket.on('answer', async ({ sdp }) => {
        await pc.setRemoteDescription({ type: 'answer', sdp: sdp.sdp });
      });
      const pending = [];
      socket.on('candidate', async ({ candidate }) => {
        if (!pc.remoteDescription) { pending.push(candidate); return; }
        try { await pc.addIceCandidate(candidate); } catch (e) { console.error(e); }
      });
      const srd = pc.setRemoteDescription.bind(pc);
      pc.setRemoteDescription = async (d) => { const r = await srd(d); while (pending.length) { await pc.addIceCandidate(pending.shift()); } return r; };
    })();
</script>
</body>
</html>
